<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#444"/>
    </marker>
  </defs>
  <rect width="900" height="780" fill="white"/>
  <rect x="5" y="5" width="890" height="770" fill="none" stroke="#DDD" stroke-width="1" rx="3"/>

  <text x="450" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#17202A">feed_forward_network — Module Schematic</text>
  <rect x="80" y="38" width="740" height="22" fill="#EBF5FB" rx="4" stroke="#AED6F1"/>
  <text x="450" y="53" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#2C3E50">SEQ_LEN=8  ·  EMBED_DIM=64  ·  FFN_DIM=256  ·  Two-layer MLP: EMBED_DIM → FFN_DIM (ReLU) → EMBED_DIM</text>

  <text x="80" y="84" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#555">INPUTS</text>
  <text x="820" y="84" text-anchor="end" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#555">OUTPUTS</text>

  <rect x="80" y="92" width="240" height="68" fill="#1E8449" rx="5"/>
  <text x="200" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white" font-weight="bold">clk · rst · start</text>
  <line x1="100" y1="118" x2="300" y2="118" stroke="#A9DFBF" stroke-width="0.5"/>
  <text x="200" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white" font-weight="bold">input_data</text>
  <text x="200" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#D4EFDF">[SEQ_LEN][EMBED_DIM] · INT16</text>

  <rect x="580" y="92" width="240" height="68" fill="#1E8449" rx="5"/>
  <text x="700" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white" font-weight="bold">done · valid</text>
  <line x1="600" y1="118" x2="800" y2="118" stroke="#A9DFBF" stroke-width="0.5"/>
  <text x="700" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white" font-weight="bold">output_data</text>
  <text x="700" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#D4EFDF">[SEQ_LEN][EMBED_DIM] · INT16</text>

  <!-- FSM -->
  <text x="450" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#444">FINITE STATE MACHINE</text>

  <circle cx="140" cy="225" r="36" fill="#2980B9" stroke="#1A5276" stroke-width="2"/>
  <text x="140" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="white" font-weight="bold">IDLE</text>
  <text x="140" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#D6EAF8">wait</text>

  <circle cx="350" cy="225" r="52" fill="#2980B9" stroke="#1A5276" stroke-width="2"/>
  <text x="350" y="217" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="white" font-weight="bold">LINEAR1</text>
  <text x="350" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#D6EAF8">EMBED→FFN</text>
  <text x="350" y="243" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#D6EAF8">+ bias + ReLU</text>

  <circle cx="560" cy="225" r="52" fill="#2980B9" stroke="#1A5276" stroke-width="2"/>
  <text x="560" y="217" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="white" font-weight="bold">LINEAR2</text>
  <text x="560" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#D6EAF8">FFN→EMBED</text>
  <text x="560" y="243" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#D6EAF8">+ bias + saturate</text>

  <circle cx="760" cy="225" r="42" fill="#2980B9" stroke="#1A5276" stroke-width="2"/>
  <text x="760" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="white" font-weight="bold">COMPLETE</text>
  <text x="760" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#D6EAF8">done=1, valid=1</text>

  <line x1="176" y1="225" x2="297" y2="225" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="237" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#666">start</text>
  <line x1="402" y1="225" x2="507" y2="225" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="455" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#666">hidden ready</text>
  <text x="455" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#666">(all seq · all hidden)</text>
  <line x1="612" y1="225" x2="717" y2="225" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="664" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#666">output ready</text>

  <path d="M 760 267 Q 760 320 530 320 Q 200 320 140 263" fill="none" stroke="#444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ah)"/>
  <text x="450" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#666">!start  →  return to IDLE</text>

  <!-- LINEAR1 datapath -->
  <text x="450" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#444">LINEAR1 DATAPATH  —  hidden[s][h] = ReLU( Σ_d input[s][d]·w1[d][h] + b1[h] )</text>

  <rect x="40" y="386" width="100" height="72" fill="#F4F6F7" stroke="#566573" rx="4"/>
  <text x="90" y="404" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#34495E">Counters</text>
  <text x="90" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#5D6D7E">seq_idx 0..7</text>
  <text x="90" y="432" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#5D6D7E">hidden_dim 0..255</text>
  <text x="90" y="444" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#5D6D7E">in_dim 0..63</text>
  <text x="90" y="456" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#7B7D7D">pipe_stage 0..2</text>

  <line x1="140" y1="420" x2="160" y2="420" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="160" y="386" width="140" height="72" fill="#B7950B" rx="4"/>
  <text x="230" y="404" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="white">ffn_w1.mem</text>
  <text x="230" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FCF3CF">64 × 256 = 16384</text>
  <text x="230" y="434" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FCF3CF">addr = in_dim×FFN_DIM</text>
  <text x="230" y="446" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FCF3CF">      + hidden_dim</text>

  <line x1="300" y1="420" x2="320" y2="420" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="320" y="386" width="160" height="72" fill="#7D3C98" rx="4"/>
  <text x="400" y="404" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="white">MAC over in_dim</text>
  <text x="400" y="422" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#E8DAEF">acc += input[s][d]</text>
  <text x="400" y="434" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#E8DAEF">     × w1_data</text>
  <text x="400" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#E8DAEF">INT32 accumulator</text>

  <line x1="480" y1="420" x2="500" y2="420" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="500" y="386" width="120" height="72" fill="#B7950B" rx="4"/>
  <text x="560" y="404" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="white">ffn_b1.mem</text>
  <text x="560" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FCF3CF">256 entries</text>
  <text x="560" y="434" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FCF3CF">addr = hidden_dim</text>
  <text x="560" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FCF3CF">(after in_dim loop)</text>

  <line x1="620" y1="420" x2="640" y2="420" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="640" y="386" width="220" height="72" fill="#C0392B" rx="4"/>
  <text x="750" y="404" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="white">+ bias  ·  ReLU clamp</text>
  <text x="750" y="422" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FADBD8">with_bias = (acc &gt;&gt;&gt; 8) + b1_data</text>
  <text x="750" y="436" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FADBD8">if (with_bias &lt; 0) → 0  (ReLU)</text>
  <text x="750" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FADBD8">else clip to INT16 → hidden_data</text>

  <!-- LINEAR2 datapath -->
  <text x="450" y="492" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#444">LINEAR2 DATAPATH  —  output[s][o] = sat( Σ_h hidden[s][h]·w2[h][o] + b2[o] )</text>

  <rect x="40" y="508" width="100" height="72" fill="#F4F6F7" stroke="#566573" rx="4"/>
  <text x="90" y="526" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#34495E">Counters</text>
  <text x="90" y="542" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#5D6D7E">seq_idx 0..7</text>
  <text x="90" y="554" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#5D6D7E">out_dim 0..63</text>
  <text x="90" y="566" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#5D6D7E">hidden_dim 0..255</text>

  <line x1="140" y1="542" x2="160" y2="542" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="160" y="508" width="140" height="72" fill="#B7950B" rx="4"/>
  <text x="230" y="526" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="white">ffn_w2.mem</text>
  <text x="230" y="542" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FCF3CF">256 × 64 = 16384</text>
  <text x="230" y="556" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FCF3CF">addr = hidden_dim×EMBED</text>
  <text x="230" y="568" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FCF3CF">      + out_dim</text>

  <line x1="300" y1="542" x2="320" y2="542" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="320" y="508" width="160" height="72" fill="#7D3C98" rx="4"/>
  <text x="400" y="526" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="white">MAC over hidden_dim</text>
  <text x="400" y="544" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#E8DAEF">acc += hidden[s][h]</text>
  <text x="400" y="556" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#E8DAEF">     × w2_data</text>
  <text x="400" y="568" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#E8DAEF">INT32 accumulator</text>

  <line x1="480" y1="542" x2="500" y2="542" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="500" y="508" width="120" height="72" fill="#B7950B" rx="4"/>
  <text x="560" y="526" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="white">ffn_b2.mem</text>
  <text x="560" y="542" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FCF3CF">64 entries</text>
  <text x="560" y="556" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FCF3CF">addr = out_dim</text>
  <text x="560" y="568" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FCF3CF">(after hidden loop)</text>

  <line x1="620" y1="542" x2="640" y2="542" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="640" y="508" width="220" height="72" fill="#0E6655" rx="4"/>
  <text x="750" y="526" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="white">+ bias  ·  saturate</text>
  <text x="750" y="544" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#A9DFBF">with_bias = (acc &gt;&gt;&gt; 8) + b2_data</text>
  <text x="750" y="558" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#A9DFBF">clamp to [INT16_MIN, INT16_MAX]</text>
  <text x="750" y="572" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#A9DFBF">→ output_data[s][o]</text>

  <!-- Internal storage -->
  <text x="450" y="614" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#444">INTERNAL STORAGE</text>
  <rect x="200" y="624" width="500" height="48" fill="#FBFCFC" stroke="#85929E" rx="4"/>
  <text x="450" y="640" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#566573">hidden_data [SEQ_LEN][FFN_DIM] = [8][256] · INT16</text>
  <text x="450" y="656" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#566573">written by LINEAR1 (post-ReLU), read by LINEAR2</text>

  <!-- Memory footer -->
  <rect x="80" y="688" width="740" height="80" fill="#FEF9E7" rx="4" stroke="#F4D03F"/>
  <text x="450" y="706" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#7D6608">Memory files (4 total)</text>
  <text x="450" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#7D6608">ffn_w1.mem  ·  EMBED_DIM × FFN_DIM = 64 × 256 = 16384 INT16 weights</text>
  <text x="450" y="736" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#7D6608">ffn_b1.mem  ·  FFN_DIM = 256 INT16 biases</text>
  <text x="450" y="750" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#7D6608">ffn_w2.mem  ·  FFN_DIM × EMBED_DIM = 256 × 64 = 16384 INT16 weights</text>
  <text x="450" y="764" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#7D6608">ffn_b2.mem  ·  EMBED_DIM = 64 INT16 biases</text>
</svg>
