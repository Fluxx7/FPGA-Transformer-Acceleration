<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#444"/>
    </marker>
  </defs>
  <rect width="900" height="800" fill="white"/>
  <rect x="5" y="5" width="890" height="790" fill="none" stroke="#DDD" stroke-width="1" rx="3"/>

  <text x="450" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#17202A">multi_head_attention — Module Schematic</text>
  <rect x="80" y="38" width="740" height="22" fill="#EBF5FB" rx="4" stroke="#AED6F1"/>
  <text x="450" y="53" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#2C3E50">SEQ_LEN=8  ·  EMBED_DIM=64  ·  NUM_HEADS=8  ·  HEAD_DIM=8  ·  Runs 8 attention heads in parallel, concatenates, applies output projection</text>

  <text x="80" y="84" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#555">INPUTS</text>
  <text x="820" y="84" text-anchor="end" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#555">OUTPUTS</text>

  <rect x="80" y="92" width="240" height="68" fill="#1E8449" rx="5"/>
  <text x="200" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white" font-weight="bold">clk · rst · start</text>
  <line x1="100" y1="118" x2="300" y2="118" stroke="#A9DFBF" stroke-width="0.5"/>
  <text x="200" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white" font-weight="bold">input_data</text>
  <text x="200" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#D4EFDF">[SEQ_LEN][EMBED_DIM] · INT16</text>

  <rect x="580" y="92" width="240" height="68" fill="#1E8449" rx="5"/>
  <text x="700" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white" font-weight="bold">done · valid</text>
  <line x1="600" y1="118" x2="800" y2="118" stroke="#A9DFBF" stroke-width="0.5"/>
  <text x="700" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white" font-weight="bold">output_data</text>
  <text x="700" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#D4EFDF">[SEQ_LEN][EMBED_DIM] · INT16</text>

  <!-- FSM -->
  <text x="450" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#444">FINITE STATE MACHINE</text>

  <circle cx="90" cy="234" r="32" fill="#2980B9" stroke="#1A5276" stroke-width="2"/>
  <text x="90" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="white" font-weight="bold">IDLE</text>
  <text x="90" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#D6EAF8">wait</text>

  <circle cx="260" cy="234" r="50" fill="#2980B9" stroke="#1A5276" stroke-width="2"/>
  <text x="260" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white" font-weight="bold">PROCESS_HEADS</text>
  <text x="260" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#D6EAF8">8 heads fire</text>
  <text x="260" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#D6EAF8">in parallel</text>

  <circle cx="450" cy="234" r="48" fill="#2980B9" stroke="#1A5276" stroke-width="2"/>
  <text x="450" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white" font-weight="bold">CONCAT_OUTPUT</text>
  <text x="450" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#D6EAF8">map 8 heads ×</text>
  <text x="450" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#D6EAF8">HEAD_DIM → EMBED</text>

  <circle cx="640" cy="234" r="46" fill="#2980B9" stroke="#1A5276" stroke-width="2"/>
  <text x="640" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white" font-weight="bold">OUTPUT_PROJ</text>
  <text x="640" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#D6EAF8">concat · Wo</text>
  <text x="640" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#D6EAF8">→ output</text>

  <circle cx="810" cy="234" r="36" fill="#2980B9" stroke="#1A5276" stroke-width="2"/>
  <text x="810" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="white" font-weight="bold">COMPLETE</text>
  <text x="810" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#D6EAF8">done=1</text>

  <line x1="122" y1="234" x2="208" y2="234" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="165" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#666">start</text>
  <text x="165" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#666">assert heads' start</text>

  <line x1="310" y1="234" x2="400" y2="234" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="355" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#666">all heads done</text>

  <line x1="498" y1="234" x2="592" y2="234" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="545" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#666">last dim written</text>

  <line x1="686" y1="234" x2="774" y2="234" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="730" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#666">last logit written</text>

  <!-- Phase 1: 8 parallel heads -->
  <text x="450" y="298" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#444">PHASE 1 — 8 attention_head instances run in parallel (PROCESS_HEADS)</text>

  <rect x="60" y="312" width="780" height="98" fill="#FDFEFE" stroke="#85929E" rx="4"/>
  <text x="80" y="330" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#566573">All 8 receive the same input_data; outputs map to head_outputs[0..7]</text>

  <g font-family="Arial,sans-serif" font-size="9" fill="white" text-anchor="middle">
    <rect x="78"  y="340" width="84" height="55" fill="#6C3483" rx="4"/>
    <text x="120" y="358" font-weight="bold">Head 0</text>
    <text x="120" y="372" font-size="7" fill="#E8DAEF">wq/wk/wv_head0</text>
    <text x="120" y="387" font-size="7" fill="#E8DAEF">→ [SEQ][HEAD_DIM]</text>

    <rect x="174" y="340" width="84" height="55" fill="#6C3483" rx="4"/>
    <text x="216" y="358" font-weight="bold">Head 1</text>
    <text x="216" y="372" font-size="7" fill="#E8DAEF">wq/wk/wv_head1</text>
    <text x="216" y="387" font-size="7" fill="#E8DAEF">→ [SEQ][HEAD_DIM]</text>

    <rect x="270" y="340" width="84" height="55" fill="#6C3483" rx="4"/>
    <text x="312" y="358" font-weight="bold">Head 2</text>
    <text x="312" y="372" font-size="7" fill="#E8DAEF">wq/wk/wv_head2</text>
    <text x="312" y="387" font-size="7" fill="#E8DAEF">→ [SEQ][HEAD_DIM]</text>

    <rect x="366" y="340" width="84" height="55" fill="#6C3483" rx="4"/>
    <text x="408" y="358" font-weight="bold">Head 3</text>
    <text x="408" y="372" font-size="7" fill="#E8DAEF">wq/wk/wv_head3</text>
    <text x="408" y="387" font-size="7" fill="#E8DAEF">→ [SEQ][HEAD_DIM]</text>

    <rect x="462" y="340" width="84" height="55" fill="#6C3483" rx="4"/>
    <text x="504" y="358" font-weight="bold">Head 4</text>
    <text x="504" y="372" font-size="7" fill="#E8DAEF">wq/wk/wv_head4</text>
    <text x="504" y="387" font-size="7" fill="#E8DAEF">→ [SEQ][HEAD_DIM]</text>

    <rect x="558" y="340" width="84" height="55" fill="#6C3483" rx="4"/>
    <text x="600" y="358" font-weight="bold">Head 5</text>
    <text x="600" y="372" font-size="7" fill="#E8DAEF">wq/wk/wv_head5</text>
    <text x="600" y="387" font-size="7" fill="#E8DAEF">→ [SEQ][HEAD_DIM]</text>

    <rect x="654" y="340" width="84" height="55" fill="#6C3483" rx="4"/>
    <text x="696" y="358" font-weight="bold">Head 6</text>
    <text x="696" y="372" font-size="7" fill="#E8DAEF">wq/wk/wv_head6</text>
    <text x="696" y="387" font-size="7" fill="#E8DAEF">→ [SEQ][HEAD_DIM]</text>

    <rect x="750" y="340" width="84" height="55" fill="#6C3483" rx="4"/>
    <text x="792" y="358" font-weight="bold">Head 7</text>
    <text x="792" y="372" font-size="7" fill="#E8DAEF">wq/wk/wv_head7</text>
    <text x="792" y="387" font-size="7" fill="#E8DAEF">→ [SEQ][HEAD_DIM]</text>
  </g>

  <text x="450" y="424" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#566573" font-style="italic">PROCESS_HEADS exits when (&amp;head_done_signals &amp; &amp;head_valid_signals) — all 8 heads simultaneously done</text>

  <!-- Phase 2: Concat -->
  <text x="450" y="456" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#444">PHASE 2 — CONCAT_OUTPUT  (cycle through dim_idx 0..EMBED_DIM-1)</text>

  <rect x="60" y="468" width="200" height="74" fill="#F4F6F7" stroke="#566573" rx="4"/>
  <text x="160" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#34495E">Counters</text>
  <text x="160" y="504" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#5D6D7E">seq_idx : 0..SEQ_LEN-1</text>
  <text x="160" y="519" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#5D6D7E">dim_idx : 0..EMBED_DIM-1</text>
  <text x="160" y="534" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#7B7D7D">(advanced together)</text>

  <line x1="260" y1="505" x2="285" y2="505" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="285" y="468" width="280" height="74" fill="#C0392B" rx="4"/>
  <text x="425" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="white">Index decompose</text>
  <text x="425" y="504" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#FADBD8">head_id  = dim_idx / HEAD_DIM</text>
  <text x="425" y="519" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#FADBD8">local_dim = dim_idx mod HEAD_DIM</text>
  <text x="425" y="534" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FADBD8">(turns flat dim_idx into 2-D address)</text>

  <line x1="565" y1="505" x2="590" y2="505" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="590" y="468" width="250" height="74" fill="#0E6655" rx="4"/>
  <text x="715" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="white">Write concatenated</text>
  <text x="715" y="504" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#A9DFBF">concatenated[seq][dim] ←</text>
  <text x="715" y="519" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#A9DFBF">head_outputs[head_id][seq][local_dim]</text>
  <text x="715" y="534" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#A9DFBF">no compute — just routing</text>

  <!-- Phase 3: Output proj -->
  <text x="450" y="568" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#444">PHASE 3 — OUTPUT_PROJ  (MAC concatenated · Wo  →  output_data)</text>

  <rect x="60" y="580" width="200" height="80" fill="#F4F6F7" stroke="#566573" rx="4"/>
  <text x="160" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#34495E">Counters</text>
  <text x="160" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#5D6D7E">seq_idx : 0..7</text>
  <text x="160" y="629" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#5D6D7E">out_dim : 0..EMBED-1</text>
  <text x="160" y="643" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#5D6D7E">in_dim  : 0..EMBED-1</text>
  <text x="160" y="655" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#7B7D7D">pipe_stage 0..2</text>

  <line x1="260" y1="620" x2="280" y2="620" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="280" y="580" width="160" height="80" fill="#B7950B" rx="4"/>
  <text x="360" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="white">attention_wo.mem</text>
  <text x="360" y="616" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#FCF3CF">EMBED² = 4096 INT16</text>
  <text x="360" y="630" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#FCF3CF">addr = in_dim · EMBED_DIM</text>
  <text x="360" y="643" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#FCF3CF">     + out_dim</text>

  <line x1="440" y1="620" x2="460" y2="620" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="460" y="580" width="160" height="80" fill="#7D3C98" rx="4"/>
  <text x="540" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="white">MAC accumulator</text>
  <text x="540" y="616" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#E8DAEF">acc += concatenated[s][in]</text>
  <text x="540" y="630" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#E8DAEF">     · wo_data</text>
  <text x="540" y="648" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#E8DAEF">INT32 (proj_accumulator)</text>

  <line x1="620" y1="620" x2="640" y2="620" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="640" y="580" width="200" height="80" fill="#0E6655" rx="4"/>
  <text x="740" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="white">Write output</text>
  <text x="740" y="618" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#A9DFBF">when in_dim==EMBED-1:</text>
  <text x="740" y="632" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#A9DFBF">  output_data[s][out_dim]</text>
  <text x="740" y="646" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#A9DFBF">  ← (acc &gt;&gt;&gt; 8)</text>

  <!-- Internal storage -->
  <text x="450" y="686" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#444">INTERNAL STORAGE</text>
  <rect x="80" y="696" width="740" height="58" fill="#FBFCFC" stroke="#85929E" rx="4"/>
  <text x="450" y="712" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#566573">head_outputs [NUM_HEADS][SEQ_LEN][HEAD_DIM]  ·  wired from each head instance — read-only here</text>
  <text x="450" y="727" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#566573">concatenated [SEQ_LEN][EMBED_DIM]  ·  populated in CONCAT_OUTPUT, consumed in OUTPUT_PROJ</text>
  <text x="450" y="742" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#566573">proj_accumulator : INT32  ·  reset between every (seq_idx, out_dim) output element</text>

  <!-- Memory footer -->
  <rect x="80" y="762" width="740" height="32" fill="#FEF9E7" rx="4" stroke="#F4D03F"/>
  <text x="450" y="782" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#7D6608">attention_wo.mem  ·  EMBED_DIM × EMBED_DIM = 64 × 64 = 4096 INT16 weights  (output projection W_O)</text>
</svg>
