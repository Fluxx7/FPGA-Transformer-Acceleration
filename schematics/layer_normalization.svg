<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#444"/>
    </marker>
  </defs>
  <rect width="900" height="820" fill="white"/>
  <rect x="5" y="5" width="890" height="810" fill="none" stroke="#DDD" stroke-width="1" rx="3"/>

  <text x="450" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#17202A">layer_normalization — Module Schematic</text>
  <rect x="80" y="38" width="740" height="22" fill="#EBF5FB" rx="4" stroke="#AED6F1"/>
  <text x="450" y="53" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#2C3E50">SEQ_LEN=8  ·  EMBED_DIM=64  ·  Residual add, then per-token mean/variance normalization with learned scale/shift</text>

  <text x="80" y="84" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#555">INPUTS</text>
  <text x="820" y="84" text-anchor="end" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#555">OUTPUTS</text>

  <rect x="80" y="92" width="260" height="90" fill="#1E8449" rx="5"/>
  <text x="210" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white" font-weight="bold">clk · rst · start</text>
  <line x1="100" y1="118" x2="320" y2="118" stroke="#A9DFBF" stroke-width="0.5"/>
  <text x="210" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white" font-weight="bold">input_data</text>
  <text x="210" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#D4EFDF">[SEQ_LEN][EMBED_DIM]</text>
  <text x="210" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white" font-weight="bold">residual_data</text>
  <text x="210" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#D4EFDF">[SEQ_LEN][EMBED_DIM]</text>

  <rect x="560" y="92" width="260" height="90" fill="#1E8449" rx="5"/>
  <text x="690" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white" font-weight="bold">done · valid</text>
  <line x1="580" y1="118" x2="800" y2="118" stroke="#A9DFBF" stroke-width="0.5"/>
  <text x="690" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white" font-weight="bold">output_data</text>
  <text x="690" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#D4EFDF">[SEQ_LEN][EMBED_DIM] · INT16</text>
  <text x="690" y="169" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#D4EFDF">y = γ · (x − μ) / σ + β</text>

  <!-- FSM -->
  <text x="450" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#444">FINITE STATE MACHINE (per sequence row)</text>

  <circle cx="100" cy="252" r="32" fill="#2980B9" stroke="#1A5276" stroke-width="2"/>
  <text x="100" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="white" font-weight="bold">IDLE</text>
  <text x="100" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#D6EAF8">wait</text>

  <circle cx="230" cy="252" r="42" fill="#2980B9" stroke="#1A5276" stroke-width="2"/>
  <text x="230" y="248" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="white" font-weight="bold">ADD_RESIDUAL</text>
  <text x="230" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#D6EAF8">sum = in + res</text>

  <circle cx="370" cy="252" r="40" fill="#2980B9" stroke="#1A5276" stroke-width="2"/>
  <text x="370" y="248" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="white" font-weight="bold">COMPUTE_MEAN</text>
  <text x="370" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#D6EAF8">μ = Σsum / N</text>

  <circle cx="500" cy="252" r="40" fill="#2980B9" stroke="#1A5276" stroke-width="2"/>
  <text x="500" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="white" font-weight="bold">COMPUTE_VAR</text>
  <text x="500" y="259" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#D6EAF8">σ² = Σ(x−μ)²/N</text>
  <text x="500" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#D6EAF8">+ improved_sqrt</text>

  <circle cx="640" cy="252" r="40" fill="#2980B9" stroke="#1A5276" stroke-width="2"/>
  <text x="640" y="248" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="white" font-weight="bold">NORMALIZE</text>
  <text x="640" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#D6EAF8">γ(x−μ)/σ + β</text>

  <circle cx="780" cy="252" r="40" fill="#2980B9" stroke="#1A5276" stroke-width="2"/>
  <text x="780" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="white" font-weight="bold">COMPLETE</text>
  <text x="780" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#D6EAF8">done/valid=1</text>

  <line x1="132" y1="252" x2="186" y2="252" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="272" y1="252" x2="328" y2="252" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="410" y1="252" x2="458" y2="252" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="540" y1="252" x2="598" y2="252" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="680" y1="252" x2="738" y2="252" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Next row loop (after NORMALIZE, if not last seq, back to COMPUTE_MEAN) -->
  <path d="M 640 292 Q 640 325 505 325 Q 370 325 370 292" fill="none" stroke="#D35400" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#ah)"/>
  <text x="505" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#D35400" font-style="italic">advance seq_idx → next row</text>

  <!-- Datapath: residual / mean / variance / normalize -->
  <text x="450" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#444">DATAPATH — Per-state operations</text>

  <!-- ADD_RESIDUAL -->
  <rect x="40" y="384" width="190" height="68" fill="#7D3C98" rx="4"/>
  <text x="135" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="white">ADD_RESIDUAL</text>
  <text x="135" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#E8DAEF">temp_sum = input[s][d]</text>
  <text x="135" y="431" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#E8DAEF">         + residual[s][d]</text>
  <text x="135" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#D7BDE2">saturate → sum_data[s][d]</text>

  <line x1="230" y1="418" x2="250" y2="418" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- COMPUTE_MEAN -->
  <rect x="250" y="384" width="190" height="68" fill="#C0392B" rx="4"/>
  <text x="345" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="white">COMPUTE_MEAN</text>
  <text x="345" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#FADBD8">mean_acc += sum_data[s][d]</text>
  <text x="345" y="431" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#FADBD8">when d=last:</text>
  <text x="345" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FADBD8">mean_val[s] = acc &gt;&gt;&gt; log2(N)</text>

  <line x1="440" y1="418" x2="460" y2="418" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- COMPUTE_VAR -->
  <rect x="460" y="384" width="220" height="68" fill="#C0392B" rx="4"/>
  <text x="570" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="white">COMPUTE_VAR</text>
  <text x="570" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#FADBD8">diff = sum_data[s][d] − mean</text>
  <text x="570" y="431" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#FADBD8">var_acc += (diff·diff) &gt;&gt;&gt; 8</text>
  <text x="570" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FADBD8">std = improved_sqrt(var+256)</text>

  <line x1="680" y1="418" x2="700" y2="418" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- NORMALIZE -->
  <rect x="700" y="384" width="160" height="68" fill="#0E6655" rx="4"/>
  <text x="780" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="white">NORMALIZE</text>
  <text x="780" y="416" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#A9DFBF">norm = ((x−μ)&lt;&lt;8)/std</text>
  <text x="780" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#A9DFBF">with_γ = (norm·γ)&gt;&gt;&gt;8</text>
  <text x="780" y="442" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#A9DFBF">y = with_γ + β  · saturate</text>

  <!-- improved_sqrt detail -->
  <text x="450" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#444">improved_sqrt FUNCTION (Newton's method, 3 iterations)</text>

  <rect x="180" y="500" width="540" height="80" fill="#FBFCFC" stroke="#85929E" rx="4"/>
  <text x="450" y="518" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#566573">if (x == 0) return 0;</text>
  <text x="450" y="532" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#566573">approx = x &gt;&gt;&gt; 1;</text>
  <text x="450" y="546" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#566573">for iter = 0..2:  approx ← (approx + x / approx) &gt;&gt;&gt; 1;</text>
  <text x="450" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#566573">return approx[15:0];</text>
  <text x="450" y="574" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#7B7D7D" font-style="italic">(blocking assignments — function-local registers, no NBA nesting)</text>

  <!-- Internal storage -->
  <text x="450" y="608" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#444">INTERNAL STORAGE</text>
  <rect x="180" y="618" width="540" height="68" fill="#FBFCFC" stroke="#85929E" rx="4"/>
  <text x="450" y="634" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#566573">sum_data  [SEQ_LEN][EMBED_DIM]  ·  pre-norm sums (after residual add)</text>
  <text x="450" y="649" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#566573">mean_val  [SEQ_LEN]  ·  per-row mean</text>
  <text x="450" y="664" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#566573">std_val   [SEQ_LEN]  ·  per-row sqrt(variance + 256) — the "+256" is a small epsilon</text>
  <text x="450" y="679" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#566573">mean_acc, var_acc · INT32 accumulators</text>

  <!-- Memory footer -->
  <rect x="80" y="702" width="740" height="60" fill="#FEF9E7" rx="4" stroke="#F4D03F"/>
  <text x="450" y="720" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#7D6608">External memory (2 files, parameterized by GAMMA_FILE / BETA_FILE)</text>
  <text x="450" y="736" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#7D6608">layernorm{1,2}_gamma.mem  ·  EMBED_DIM = 64 INT16 entries (scale γ)</text>
  <text x="450" y="752" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#7D6608">layernorm{1,2}_beta.mem   ·  EMBED_DIM = 64 INT16 entries (shift β)</text>

  <!-- Pipeline -->
  <rect x="80" y="772" width="740" height="36" fill="#FBFCFC" stroke="#85929E" rx="4"/>
  <text x="450" y="788" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#566573">NORMALIZE stage uses pipe_stage 0/1/2 — fetch γ/β from BRAM, then compute and store y</text>
  <text x="450" y="802" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#7B7D7D" font-style="italic">Two instances are used in the top-level: norm1 follows attention, norm2 follows FFN</text>
</svg>
